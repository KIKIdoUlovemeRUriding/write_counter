name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish src/InkFlow/InkFlow.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "publish/InkFlow.exe" --title "InkFlow ${{ github.ref_name }}" --notes "Windows 10/11 单文件构建，需要安装 .NET 9 Desktop Runtime。下载 InkFlow.exe 后直接运行；设置与统计保存在 %AppData%\InkFlow。"
