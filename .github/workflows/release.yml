name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish framework-dependent single-file
        shell: pwsh
        run: |
          dotnet publish src/InkFlow/InkFlow.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish

      - name: Publish self-contained single-file
        shell: pwsh
        run: |
          dotnet publish src/InkFlow/InkFlow.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish-selfcontained
          Move-Item "publish-selfcontained/InkFlow.exe" "publish-selfcontained/InkFlow-selfcontained.exe" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows 10/11 单文件版本。`n- InkFlow-selfcontained.exe：自带 .NET 9 运行时，下载即用，体积较大。`n- InkFlow.exe：框架依赖版，需要安装 .NET 9 Desktop Runtime。`n设置与统计保存在 %AppData%\InkFlow。"
          gh release create "${{ github.ref_name }}" "publish/InkFlow.exe" "publish-selfcontained/InkFlow-selfcontained.exe" --title "InkFlow ${{ github.ref_name }}" --notes $notes
